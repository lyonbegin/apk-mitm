name: M330 Pro mobile web smoke test
on:
  push:
    branches:
      - m330-pro-mobile-web
    paths:
      - 'm330-mobile-web/**'
      - '.github/workflows/m330-web-smoke.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASE: https://m330-web-github-production.up.railway.app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate read-only LAN gateway (offline)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile m330-mobile-web/gateway/m330_lan_probe.py
          python3 -m py_compile m330-mobile-web/gateway/m330_fleet_bridge.py
          python3 m330-mobile-web/gateway/m330_fleet_bridge.py --dry-run | jq -e '.mode=="simulation" and .devices_contacted==0 and .uploads==0'
          python3 m330-mobile-web/gateway/m330_lan_probe.py --simulate > /tmp/gateway.json
          jq -e '.mode == "simulation" and .command_writes_enabled == false' /tmp/gateway.json
          python3 m330-mobile-web/gateway/m330_lan_probe.py --help | grep -q '\-\-probe'
      - name: Verify public UI and persistent SQLite API
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 30); do
            if curl -fsS --max-time 8 "$BASE/api/health" -o /tmp/health.json && \
               jq -e '.ok == true and .storage == "sqlite"' /tmp/health.json >/dev/null; then
              break
            fi
            sleep 3
          done
          grep -q "M330" <(curl -fsS "$BASE/")
          curl -fsS -c /tmp/m330-cookie -b /tmp/m330-cookie "$BASE/api/dashboard" >/tmp/before.json
          jq -e '.mode=="robot_motion_simulation" and .features.real_write_verified == false' /tmp/before.json
          robot=$(jq -r '.robots[0].id' /tmp/before.json)
          curl -fsS -c /tmp/m330-cookie -b /tmp/m330-cookie \
            -H "Content-Type: application/json" \
            -d "{\"robot_id\":$robot,\"floor_id\":\"myeonhak-3\",\"time\":\"08:30\",\"weekdays\":\"0,1,2,3,4\"}" \
            "$BASE/api/tasks" >/tmp/created.json
          id=$(jq -r '.id' /tmp/created.json)
          test "$id" != null
          curl -fsS -c /tmp/m330-cookie -b /tmp/m330-cookie "$BASE/api/dashboard" >/tmp/after.json
          jq -e --argjson id "$id" '.tasks | any(.id == $id)' /tmp/after.json
          curl -fsS "$BASE/api/dashboard" | jq -e '.tasks | length == 0'
          curl -fsS -b /tmp/m330-cookie -X DELETE "$BASE/api/tasks/$id" | jq -e '.ok == true'
          curl -fsS -b /tmp/m330-cookie "$BASE/api/dashboard" | jq -e --argjson id "$id" '.tasks | all(.id != $id)'
          curl -fsS -b /tmp/m330-cookie -H 'Content-Type: application/json' \
            -d "{\"robot_id\":$robot,\"command\":\"start\"}" \
            "$BASE/api/command" | jq -e '.simulated==true'
          echo "PASS: UI, persistent SQLite schedule CRUD, cookie isolation, virtual robot movement commands"

      - name: Verify read-only LAN bridge API without a robot
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile m330-mobile-web/gateway/m330_bridge.py
          python3 m330-mobile-web/gateway/m330_bridge.py --dry-run | jq -e '.would_upload==false and .connected==false'
          for n in $(seq 1 30); do
            if curl -fsS --max-time 8 "$BASE/api/health" | jq -e '.gateway_bridge=="read_only"' >/dev/null; then
              break
            fi
            sleep 3
          done
          curl -fsS "$BASE/api/health" | jq -e '.gateway_bridge=="read_only"'
          curl -fsS -c /tmp/bridge-cookie -b /tmp/bridge-cookie "$BASE/api/dashboard" >/dev/null
          curl -fsS -c /tmp/bridge-cookie -b /tmp/bridge-cookie -X POST "$BASE/api/gateway/pair" > /tmp/bridge-key.json
          key=$(jq -r '.pair_key' /tmp/bridge-key.json)
          test "${#key}" = 64
          curl -fsS -b /tmp/bridge-cookie "$BASE/api/gateway/status" | jq -e '.paired==true and .online==false'
          curl -fsS -X POST -H "Content-Type: application/json" -H "X-M330-Pairing-Key: $key" \
            -d '{"mode":"read_only","connected":false,"raw_dps":{},"device_ref":"","protocol":""}' \
            "$BASE/api/gateway/observations" | jq -e '.received==true and .interpreted==false'
          curl -fsS -b /tmp/bridge-cookie "$BASE/api/gateway/status" | jq -e '.paired==true and .online==false and .last_seen!=null'
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: application/json" \
            -H "X-M330-Pairing-Key: $key" -d '{"mode":"simulation","connected":true,"raw_dps":{}}' "$BASE/api/gateway/observations")
          test "$code" = 422
          curl -fsS -b /tmp/bridge-cookie -X POST "$BASE/api/gateway/revoke" | jq -e '.ok==true'
          curl -fsS -b /tmp/bridge-cookie "$BASE/api/gateway/status" | jq -e '.paired==false and .last_seen==null'
          echo "PASS: read-only bridge pairing, rejected simulation, upload, revoke"

      - name: Verify multiple independent robots and batch commands (demo only)
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 30); do
            if curl -fsS --max-time 8 "$BASE/api/health" | jq -e '.version=="0.5.0" and .fleet==true' >/dev/null; then break; fi
            sleep 3
          done
          curl -fsS "$BASE/api/health" | jq -e '.fleet==true and .version=="0.5.0"'
          jar=/tmp/m330-fleet-cookie
          curl -fsS -c "$jar" -b "$jar" "$BASE/api/dashboard" > /tmp/fleet-start.json
          first=$(jq -r '.robots[0].id' /tmp/fleet-start.json)
          test "$first" != null
          curl -fsS -c "$jar" -b "$jar" -H 'Content-Type: application/json' \
            -d '{"name":"검증 2호기","floor_id":"gyeongae-2"}' "$BASE/api/robots" >/tmp/robot2.json
          second=$(jq -r '.robot.id' /tmp/robot2.json)
          jq -e '.robot.name=="검증 2호기" and .robot.floor_id=="gyeongae-2"' /tmp/robot2.json
          curl -fsS -b "$jar" "$BASE/api/dashboard" | jq -e --argjson id "$second" '(.robots|length)==2 and (.robots|any(.id==$id))'
          curl -fsS -b "$jar" -H 'Content-Type: application/json' \
            -d "{\"robot_id\":$second,\"floor_id\":\"gyeongae-2\",\"time\":\"10:30\",\"weekdays\":\"0,1,2,3,4\"}" \
            "$BASE/api/tasks" >/tmp/task2.json
          task=$(jq -r .id /tmp/task2.json)
          curl -fsS -b "$jar" -H 'Content-Type: application/json' \
            -d "{\"robot_id\":$first,\"command\":\"start\",\"floor_id\":\"myeonhak-3\"}" \
            "$BASE/api/command" | jq -e --argjson id "$first" '.simulated==true and .robot_id==$id'
          curl -fsS -b "$jar" "$BASE/api/dashboard" | jq -e \
            --argjson first "$first" --argjson second "$second" \
            '.robots | (map(select(.id==$first))[0].status=="청소 중") and (map(select(.id==$second))[0].status=="대기")'
          curl -fsS -b "$jar" -H 'Content-Type: application/json' \
            -d "{\"robot_id\":$first,\"action\":\"stop\"}" "$BASE/api/sim/command" | jq -e '.ok'
          curl -fsS -b "$jar" -H 'Content-Type: application/json' \
            -d "{\"command\":\"start\",\"robot_ids\":[$first,$second]}" "$BASE/api/commands/batch" | jq -e '.simulated==true and .affected==2'
          curl -fsS -b "$jar" "$BASE/api/dashboard" | jq -e \
            --argjson first "$first" --argjson second "$second" --argjson task "$task" \
            '((.robots|length)==2 and (.robots|all(.status=="청소 중"))) and
             (.tasks | any(.id==$task and .robot_id==$second)) and
             (.events | any(.robot_id==$first) and any(.robot_id==$second))'
          curl -fsS -b "$jar" -H 'Content-Type: application/json' \
            -X PATCH -d '{"name":"검증 2호기 변경","floor_id":"gyeongae-1"}' \
            "$BASE/api/robots/$second" | jq -e '.robot.name=="검증 2호기 변경" and .robot.floor_id=="gyeongae-1"'
          curl -fsS -b "$jar" -H 'Content-Type: application/json' -d "{\"robot_id\":$first}" \
            "$BASE/api/gateway/pair" > /tmp/m330-key-1.json
          curl -fsS -b "$jar" -H 'Content-Type: application/json' -d "{\"robot_id\":$second}" \
            "$BASE/api/gateway/pair" > /tmp/m330-key-2.json
          firstkey=$(jq -r .pair_key /tmp/m330-key-1.json)
          secondkey=$(jq -r .pair_key /tmp/m330-key-2.json)
          test "$firstkey" != "$secondkey"
          curl -fsS -b "$jar" "$BASE/api/gateway/status?robot_id=$first" | jq -e '.paired==true and .online==false'
          curl -fsS -b "$jar" "$BASE/api/gateway/status?robot_id=$second" | jq -e '.paired==true and .online==false'
          curl -fsS -H "Content-Type: application/json" -H "X-M330-Pairing-Key: $secondkey" \
            -d '{"mode":"read_only","connected":false,"raw_dps":{"6":77},"device_ref":"","protocol":""}' \
            "$BASE/api/gateway/observations" | jq -e --argjson second "$second" '.received and .robot_id==$second'
          curl -fsS -b "$jar" "$BASE/api/gateway/status?robot_id=$first" | jq -e '.last_seen==null'
          curl -fsS -b "$jar" "$BASE/api/gateway/status?robot_id=$second" | jq -e '.raw_dps["6"]==77 and .last_seen!=null'
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d "{\"robot_id\":$second,\"command\":\"start\"}" "$BASE/api/command")
          test "$code" = 404
          curl -fsS -b "$jar" -X DELETE "$BASE/api/robots/$second" | jq -e '.ok and .archived'
          curl -fsS -b "$jar" "$BASE/api/dashboard" | jq -e \
            --argjson first "$first" --argjson second "$second" '(.robots|length)==1 and .robots[0].id==$first'
          curl -fsS -b "$jar" "$BASE/api/dashboard" | jq -e \
            --argjson second "$second" '.events | any(.robot_id==$second)'
          curl -fsS -b "$jar" -X DELETE "$BASE/api/tasks/$task" | jq -e '.ok'
          code=$(curl -sS -o /dev/null -w '%{http_code}' -b "$jar" -X DELETE "$BASE/api/robots/$first")
          test "$code" = 409
          curl -fsS -b "$jar" -H 'Content-Type: application/json' -d "{\"robot_id\":$first}" "$BASE/api/gateway/revoke" | jq -e '.ok'
          echo "PASS: multi-robot CRUD, isolation, per-robot pair keys, batch commands, archive history"

      - name: Verify public-only digital twin with stairs and simulated cleaning
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 30); do
            if curl -fsS --max-time 8 "$BASE/api/health" | jq -e '.version=="0.5.0" and .stairs_included==true' >/dev/null; then break; fi
            sleep 3
          done
          curl -fsS "$BASE/api/health" | jq -e '.common_areas_only==true and .stairs_robot_cleanable==false'
          curl -fsS "$BASE/twin-client.js" | grep -q '공용부 청소 디지털 트윈'
          curl -fsS "$BASE/twin.css" | grep -q 'twin-stairs'
          jar=/tmp/twin-cookie
          curl -fsS -c "$jar" -b "$jar" "$BASE/api/dashboard" > /tmp/twin-before.json
          robot=$(jq -r '.robots[0].id' /tmp/twin-before.json)
          for building in myeonhak gyeongae; do
            for floor in 1 2 3 4 5; do
              curl -fsS -b "$jar" "$BASE/api/twin/map?floor_id=$building-$floor" | \
                jq -e '.is_surveyed==false and
                  ([.zones[] | select(.kind=="stairs")] | length)==2 and
                  ([.zones[] | select(.kind=="corridor")] | length)==3 and
                  ([.zones[] | select(.robot_cleanable==false)] | length)==2 and
                  (.zones | all(.kind!="classroom" and .kind!="office"))'
            done
          done
          curl -fsS -b "$jar" -H 'Content-Type: application/json' \
            -d '{"floor_id":"myeonhak-5","zone_id":"stairs-west","action":"complete"}' \
            "$BASE/api/twin/manual" | jq -e '.manual and .completed and .robot_cleaning==false'
          curl -fsS -b "$jar" "$BASE/api/twin/state?floor_id=myeonhak-5" | \
            jq -e '.stairs | any(.zone_id=="stairs-west" and .completed)'
          code=$(curl -sS -o /dev/null -w '%{http_code}' -b "$jar" -H 'Content-Type: application/json' \
            -d "{\"robot_id\":$robot,\"floor_id\":\"myeonhak-5\",\"zone_id\":\"stairs-west\",\"action\":\"start\"}" \
            "$BASE/api/twin/command")
          test "$code" = 422
          curl -fsS -b "$jar" -H 'Content-Type: application/json' \
            -d "{\"robot_id\":$robot,\"floor_id\":\"myeonhak-5\",\"zone_id\":\"corridor-center\",\"action\":\"start\"}" \
            "$BASE/api/twin/command" | jq -e '.simulated==true and .hardware_command==false'
          curl -fsS -b "$jar" "$BASE/api/twin/state?floor_id=myeonhak-5" | \
            jq -e --argjson id "$robot" '.runs | any(.robot_id==$id and .zone_id=="corridor-center" and .state=="running")'
          curl -fsS -b "$jar" -H 'Content-Type: application/json' \
            -d "{\"robot_id\":$robot,\"action\":\"pause\"}" "$BASE/api/twin/command" | jq -e '.ok'
          curl -fsS -b "$jar" "$BASE/api/twin/state?floor_id=myeonhak-5" | \
            jq -e '.runs | any(.state=="paused")'
          curl -fsS -b "$jar" -H 'Content-Type: application/json' \
            -d "{\"robot_id\":$robot,\"action\":\"resume\"}" "$BASE/api/twin/command" | jq -e '.ok'
          curl -fsS -b "$jar" -H 'Content-Type: application/json' \
            -d "{\"robot_id\":$robot,\"action\":\"reset\"}" "$BASE/api/twin/command" | jq -e '.ok'
          curl -fsS -b "$jar" -H 'Content-Type: application/json' \
            -d '{"floor_id":"myeonhak-5","zone_id":"stairs-west","action":"reset"}' "$BASE/api/twin/manual" | jq -e '.completed==false'
          echo "PASS: ten illustrative floor plans, stair manual workflows, robot restrictions, route simulation"

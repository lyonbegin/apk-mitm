name: M330 Pro fleet browser e2e
on:
  push:
    branches:
      - m330-pro-mobile-web
    paths:
      - 'm330-mobile-web/**'
      - '.github/workflows/m330-browser-smoke.yml'
  workflow_dispatch:
jobs:
  browser-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Start local M330 web and twin server
        shell: bash
        run: |
          M330_DB_PATH=/tmp/m330-fleet-ci.sqlite PORT=3000 bun run m330-mobile-web/index.ts >/tmp/m330-server.log 2>&1 &
          echo $! > /tmp/m330-server.pid
          for n in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/api/health | grep -q robot_motion_simulation; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health | grep -q robot_motion_simulation || { cat /tmp/m330-server.log; exit 1; }
      - name: Install Playwright and Chromium
        working-directory: m330-mobile-web/tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Install local Tuya EZ activation SDK and validate no-credential flow
        working-directory: m330-mobile-web/gateway
        run: |
          npm install --ignore-scripts --omit=dev --no-audit --no-fund
          node --check m3_pair_ez.cjs
          node m3_pair_ez.cjs --self-test | grep -q 'SELF_TEST_OK'
      - name: Verify M3 Max Wi-Fi and cloud activation job (no real hardware)
        run: |
          python3 -m py_compile m330-mobile-web/gateway/m3_onboard.py m330-mobile-web/gateway/m3_wifi_local.py m330-mobile-web/gateway/m3_pair_job.py m330-mobile-web/gateway/test_m3_wifi.py m330-mobile-web/gateway/test_m3_pair_job.py
          python3 m330-mobile-web/gateway/m3_onboard.py --simulate | grep -q '"commands_enabled": false'
          python3 -m unittest discover -s m330-mobile-web/gateway -p 'test_m3_*.py' -v
      - name: Verify localhost Wi-Fi operator page and deny unsolicited HTTP writes
        shell: bash
        run: |
          python3 m330-mobile-web/gateway/m3_wifi_local.py >/tmp/m3-wifi-local.log 2>&1 &
          helper_pid=$!
          trap 'kill "$helper_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8765/ > /tmp/m3-wifi-page.html; then break; fi
            sleep 1
          done
          grep -q 'M3 Max Wi-Fi 연결' /tmp/m3-wifi-page.html
          grep -q '로봇 AP 접속' /tmp/m3-wifi-page.html
          grep -q '실제 Wi-Fi EZ 등록' /tmp/m3-wifi-page.html
          curl --fail --silent http://127.0.0.1:8765/api/pair/status | grep -q '"registered": false'
          http_code=$(curl --silent --output /tmp/m3-wifi-denied.json --write-out '%{http_code}' \
            -X POST http://127.0.0.1:8765/api/join \
            -H 'Content-Type: application/json' --data '{"ssid":"SmartLife"}')
          test "$http_code" = 403

      - name: Verify robot motion simulation engine
        working-directory: m330-mobile-web/tests
        env:
          M330_BASE: http://localhost:3000/
        run: node sim-api.test.mjs
      - name: Verify mobile fleet and staircase twin UI in local Chromium
        working-directory: m330-mobile-web/tests
        env:
          M330_BASE: http://localhost:3000/
        run: node fleet-playwright.mjs
      - name: Upload before-and-after robot movement screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m330-map-motion-evidence
          path: m330-mobile-web/tests/sim-*.png
          if-no-files-found: ignore
          retention-days: 14
